spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/universidad}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.thymeleaf.cache=true
logging.level.org.hibernate.SQL=WARN
app.seed.users.count=20
app.seed.test-user.email=prueba.usuario@universidad.test
app.seed.test-admin.email=prueba.admin@universidad.test
