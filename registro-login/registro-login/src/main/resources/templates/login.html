<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="page-shell auth-shell">
    <div class="auth-card">
        <div class="auth-header">
            <p class="eyebrow">Bienvenido</p>
            <h1>Accede a tu cuenta</h1>
        </div>

        <div class="alert alert-error" th:if="${param.error}">
            El correo o la contraseña no coinciden.
        </div>
        <div class="alert alert-success" th:if="${param.logout}">
            Sesión cerrada correctamente.
        </div>

        <form th:action="@{/login}" method="post" class="auth-form">
            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input id="email" type="email" name="email" required autofocus maxlength="100" placeholder="usuario@correo.com">
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input id="password" type="password" name="password" required minlength="8" maxlength="72" placeholder="••••••••">
            </div>

            <div class="button-row">
                <button type="submit" class="button primary">Entrar</button>
                <a th:href="@{/}" class="button secondary">Volver</a>
            </div>
        </form>

        <p class="helper-text">¿No tiene cuenta? <a th:href="@{/register}">Regístrese aquí</a></p>
    </div>
</div>
</body>
</html>
