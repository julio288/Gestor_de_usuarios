<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mi perfil</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="page-shell auth-shell">
    <div class="auth-card">
        <div class="auth-header">
            <p class="eyebrow">Cuenta personal</p>
            <h1>Mi perfil</h1>
            <p class="lead">Mantén actualizados tus datos de acceso y contacto.</p>
        </div>

        <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>
        <div class="alert alert-error" th:if="${formError}" th:text="${formError}"></div>

        <form th:action="@{/profile}" th:object="${profileForm}" method="post" class="auth-form">
            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input id="email" type="email" th:field="*{email}" required maxlength="100">
                <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
            </div>
            <div class="form-group">
                <label for="firstName">Nombre</label>
                <input id="firstName" type="text" th:field="*{firstName}" required minlength="2" maxlength="50">
                <span class="field-error" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></span>
            </div>
            <div class="form-group">
                <label for="lastName">Apellido</label>
                <input id="lastName" type="text" th:field="*{lastName}" required minlength="2" maxlength="50">
                <span class="field-error" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></span>
            </div>
            <div class="button-row">
                <button class="button primary" type="submit">Guardar cambios</button>
                <a class="button secondary" th:href="@{/dashboard}">Volver al panel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
