<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Usuarios</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="page-shell table-shell">
    <div class="topbar">
        <div class="user-greeting">
            <span>Bienvenido,</span>
            <strong sec:authentication="principal.fullName">Usuario</strong>
        </div>
        <form th:action="@{/logout}" method="post" class="logout-form">
            <button type="submit" class="button secondary">Cerrar sesión</button>
        </form>
    </div>

    <div class="table-card">
        <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>
        <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>
        <div class="section-heading">
            <div>
                <p class="eyebrow">Panel</p>
                <h1>Usuarios del sistema</h1>
            </div>
            <a class="button primary" th:href="@{/register}">Nuevo usuario</a>
        </div>

        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Correo</th>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>Rol</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${listUsers}">
                <td th:text="${user.id}">0</td>
                <td th:text="${user.email}">correo</td>
                <td th:text="${user.firstName}">nombre</td>
                <td th:text="${user.lastName}">apellido</td>
                <td th:text="${user.role}">ROLE_USER</td>
                <td>
                    <div class="button-row">
                        <a class="button secondary" th:href="@{/users/{id}/edit(id=${user.id})}">Editar</a>
                        <form th:if="${user.email != actorEmail}"
                            th:action="@{/users/{id}/delete(id=${user.id})}" method="post"
                            onsubmit="return confirm('¿Eliminar este usuario?')">
                            <button class="button danger" type="submit">Eliminar</button>
                        </form>
                        <span th:if="${user.email == actorEmail}">Tu cuenta</span>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
