<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registro exitoso</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="page-shell auth-shell">
    <div class="auth-card success-card">
        <div class="success-icon">✓</div>
        <p class="eyebrow">Proceso completado</p>
        <h1>Registro exitoso</h1>
        <p>El usuario fue registrado correctamente en el sistema.</p>
        <div class="button-row">
            <a class="button primary" th:href="@{/login}">Iniciar sesión</a>
            <a th:href="@{/}" class="button secondary">Inicio</a>
        </div>
    </div>
</div>
</body>
</html>
