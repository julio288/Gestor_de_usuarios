<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registro</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="page-shell auth-shell">
    <div class="auth-card wide-card">
        <div class="auth-header">
            <p class="eyebrow">Nuevo usuario</p>
            <h1>Crea tu cuenta</h1>
        </div>

        <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

        <form th:action="@{/process_register}" th:object="${registrationForm}" method="post" class="auth-form grid-form">

            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input id="email" type="email" th:field="*{email}" required maxlength="100" autocomplete="email" placeholder="usuario@correo.com">
                <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Error email</span>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input id="password" type="password" th:field="*{password}" required minlength="8" maxlength="72" autocomplete="new-password" placeholder="Mínimo 8 caracteres">
                <span class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Error password</span>
            </div>

            <div class="form-group full-width">
                <label for="confirmPassword">Confirmar contraseña</label>
                <input id="confirmPassword" type="password" th:field="*{confirmPassword}" required maxlength="72" autocomplete="new-password">
                <span class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}">Error confirmar contraseña</span>
            </div>

            <div class="form-group">
                <label for="accountType">Tipo de cuenta</label>
                <select id="accountType" th:field="*{accountType}">
                    <option value="ROLE_USER">Usuario</option>
                    <option value="ROLE_ADMIN">Administrador</option>
                </select>
            </div>

            <div class="form-group" id="adminCodeGroup" hidden>
                <label for="adminCode">Código de administrador</label>
                <input id="adminCode" type="password" th:field="*{adminCode}" maxlength="72" autocomplete="off">
            </div>

            <div class="form-group">
                <label for="firstName">Nombre</label>
                <input id="firstName" type="text" th:field="*{firstName}" required minlength="2" maxlength="50" autocomplete="given-name" placeholder="Tu nombre">
                <span class="field-error" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}">Error nombre</span>
            </div>

            <div class="form-group">
                <label for="lastName">Apellido</label>
                <input id="lastName" type="text" th:field="*{lastName}" required minlength="2" maxlength="50" autocomplete="family-name" placeholder="Tu apellido">
                <span class="field-error" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}">Error apellido</span>
            </div>

            <div class="button-row full-width">
                <button type="submit" class="button primary">Registrar</button>
                <a th:href="@{/}" class="button secondary">Volver</a>
            </div>
        </form>
        <p class="helper-text">¿Ya tienes cuenta? <a th:href="@{/login}">Entra aquí</a></p>
    </div>
</div>
<script>
    const accountType = document.getElementById('accountType');
    const adminCodeGroup = document.getElementById('adminCodeGroup');
    const adminCode = document.getElementById('adminCode');

    function updateAdminCodeVisibility() {
        const selectingAdmin = accountType.value === 'ROLE_ADMIN';
        adminCodeGroup.hidden = !selectingAdmin;
        adminCode.required = selectingAdmin;
    }

    accountType.addEventListener('change', updateAdminCodeVisibility);
    updateAdminCodeVisibility();
</script>
</body>
</html>
