<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Administración</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="page-shell table-shell">
    <div class="topbar">
        <div class="user-greeting">
            <span>Administración</span>
            <strong th:text="${fullName}">Administrador</strong>
        </div>
        <form th:action="@{/logout}" method="post" class="logout-form">
            <button type="submit" class="button secondary">Cerrar sesión</button>
        </form>
    </div>

    <main class="hero-card">
        <div class="hero-copy">
            <p class="eyebrow">Acceso exclusivo para administradores</p>
            <h1>Centro de administración</h1>
            <p class="lead">Gestiona las cuentas registradas y vuelve a tu espacio personal cuando lo necesites.</p>
            <div class="cta-row">
                <a th:href="@{/users}" class="button primary">Gestionar usuarios</a>
                <a th:href="@{/dashboard}" class="button secondary">Volver al panel</a>
            </div>
        </div>
    </main>
</div>
</body>
</html>
